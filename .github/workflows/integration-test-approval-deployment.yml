# Integration Test Approval Deployment — Stage 2 of 2
#
# This workflow runs in the context of the base branch (via workflow_run) after
# any approval is submitted on a PR — including community approvals. That is why
# the validate job checks who actually approved it, whether they are a CDK team
# member, and whether the approval has gone stale before proceeding.
#
# Jobs:
#   validate — verifies the approval is valid, from a CDK team member, and that
#              the PR contains snapshot changes worth deploying.
#   deploy — checks out the PR code and runs integration tests on CodeBuild.
#
# Security: No artifacts are passed from Stage 1 (integration-test-approval-trigger.yml).
# All PR metadata comes from the GitHub API (trusted). PR code only executes
# after approval is verified.

name: Integration Test Approval Deployment

on:
  workflow_run:
    workflows: ['Integration Test Approval Trigger']
    types: [completed]

permissions:
  contents: read
  pull-requests: read   # List open PRs to find PR from head SHA
  statuses: write       # Post commit statuses on the PR

# Use repo full_name + branch as concurrency key. The PR number is not guaranteed
# to be present in workflow_run context, so we use repo+branch as a proxy. This
# ensures unique groups per fork+branch, preventing collisions between different
# PRs even if they share a branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  # Validates the approval: finds the PR, confirms a CDK team member approved
  # the current head commit, checks for snapshot changes, and posts commit
  # status updates to the PR.
  # Runs on ubuntu-latest — does not need the CodeBuild runner or Atmosphere.
  validate:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      pr_number: ${{ steps.find-pr.outputs.pr_number }}
      approved_sha: ${{ steps.find-pr.outputs.approved_sha }}
      base_sha: ${{ steps.find-pr.outputs.base_sha }}
      has_snapshots: ${{ steps.check-snapshots.outputs.has_snapshots }}

    steps:
      - name: Checkout default branch (main)
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Find PR from head SHA
        id: find-pr
        uses: actions/github-script@v7
        with:
          script: |
            // TESTING: Hardcoded PR #8 on abidhasan-aws/aws-cdk
            core.setOutput('pr_number', '8');
            core.setOutput('approved_sha', '591dab602c130119cbcdcb94f6fec4df86d8566f');
            core.setOutput('base_sha', '817c50bd4169d2fd5ed4ca49c2ae1c9d94e5b76e');

      # TESTING: Mock verify-approval.js with configurable outcome.
      # Set MOCK_RESULT to one of: approved, no_approvals, stale, non_member, closed, not_found, api_error
      - name: Verify maintainer approval (non-stale)
        run: |
          case "$MOCK_RESULT" in
            approved)
              echo "PR #8 is approved by CDK team member: test-user"
              exit 0
              ;;
            no_approvals)
              echo "PR #8 has no approvals" >&2
              exit 1
              ;;
            stale)
              echo "PR #8 head has changed (expected 33ef6a4, got abc1234). New approval needed." >&2
              exit 1
              ;;
            non_member)
              echo "PR #8 has no valid (non-stale) approval from a CDK team member" >&2
              exit 1
              ;;
            closed)
              echo "PR #8 is closed, skipping (only open PRs are eligible)" >&2
              exit 1
              ;;
            not_found)
              echo "PR #8 not found" >&2
              exit 1
              ;;
            api_error)
              echo "Failed to fetch PR #8: HTTP 500" >&2
              exit 1
              ;;
            *)
              echo "Unknown MOCK_RESULT: $MOCK_RESULT" >&2
              exit 1
              ;;
          esac
        env:
          MOCK_RESULT: approved

      - name: Check for snapshot changes
        id: check-snapshots
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comparison } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: '${{ steps.find-pr.outputs.base_sha }}',
              head: '${{ steps.find-pr.outputs.approved_sha }}',
            });
            const snapshotPattern = /\.(?:js|ts)\.snapshot\//;
            const snapshots = comparison.files
              .map(f => f.filename)
              .filter(f => snapshotPattern.test(f));
            if (snapshots.length === 0) {
              core.info('No integration test snapshot changes detected.');
              core.setOutput('has_snapshots', 'false');
            } else {
              core.info(`Found ${snapshots.length} changed snapshot file(s).`);
              core.setOutput('has_snapshots', 'true');
            }

      - name: Post status (success — skipped, no snapshots)
        if: steps.check-snapshots.outputs.has_snapshots == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.find-pr.outputs.approved_sha }}',
              state: 'success',
              context: 'Integration Tests (Approval)',
              description: 'Skipped — no integration test snapshot changes',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });


  # If validation succeeds, a CDK maintainer has approved the PR code on this
  # exact commit. This means the code is trusted by the CDK team and we can
  # proceed to check it out and run it in a privileged context (CodeBuild
  # with Atmosphere).
  #
  # Instead of gating this job with a GitHub Environment (like integration-test-deployment.yml),
  # we rely solely on verify-approval.js to check whether the approval is valid and
  # non-stale. This allows the workflow to run automatically without any manual
  # interaction from the maintainer.
  deploy:
    needs: validate
    if: needs.validate.outputs.has_snapshots == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Post status (pending — running tests)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.validate.outputs.approved_sha }}',
              state: 'pending',
              context: 'Integration Tests (Approval)',
              description: 'Running integration tests...',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      # Checking out the contributor's code at the exact commit SHA that was
      # approved. This SHA is pinned from the workflow_run event — even if new
      # commits are pushed after approval, this checkout is unaffected.
      - name: Checkout PR head for test execution
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.approved_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: echo "MOCK — skipping yarn install"

      - name: Build integration test tooling
        run: echo "MOCK — skipping build"

      - name: Build Integration Test packages
        run: echo "MOCK — skipping build"

      - name: Run integration tests
        run: echo "MOCK — integration tests passed"

      - name: Post status (success — tests passed)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.validate.outputs.approved_sha }}',
              state: 'success',
              context: 'Integration Tests (Approval)',
              description: 'Integration tests passed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Post status (failure — tests failed or cancelled)
        if: ${{ !success() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ needs.validate.outputs.approved_sha }}',
              state: 'failure',
              context: 'Integration Tests (Approval)',
              description: 'Integration tests failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
