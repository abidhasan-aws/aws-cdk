# Stage 1: Unprivileged trigger signal for integration test deployment.
#
# This workflow fires when a PR review is approved and simply completes, signaling
# the privileged Stage 2 workflow (integration-test-auto-deploy.yml)
# via the workflow_run event.
#
# Security note: This workflow runs in the context of the PR (pull_request_review)
# and has minimal permissions. The privileged work happens in Stage 2.

name: Integration Test Approval Trigger

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    if: github.event.review.state == 'approved'
    steps:
      - name: Signal complete
        run: echo "Approved review submitted. Signaling Stage 2 workflow."
